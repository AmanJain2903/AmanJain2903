  <rect class="box" x="70" y="1298" width="2260" height="36"/>
  <text class="tag" x="95" y="1321">LEGEND</text>
  <line x1="180" y1="1316" x2="245" y2="1316" class="lineBlue"/>
  <text class="ps" x="260" y="1321">chat/request path</text>
  <line x1="420" y1="1316" x2="485" y2="1316" class="lineGreen"/>
  <text class="ps" x="500" y="1321">Mickey runtime/tool flow</text>
  <line x1="720" y1="1316" x2="785" y2="1316" class="lineDash"/>
  <text class="ps" x="800" y="1321">data/provider dependency</text>
  <text class="ps" x="1020" y="1321">Operational rule: Mickey is deactivated during Pinecone namespace rebuilds to avoid partial RAG answers.</text>
